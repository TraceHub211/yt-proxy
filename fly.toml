# fly.toml - generated for yt-proxy
app = "yt-proxy"
primary_region = "ams"  # Amsterdam - close to your VPS

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false   # keep always on (free tier allows this)
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
